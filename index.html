<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expense Tracker</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input, select, button {
          min-height: 44px;
      box-sizing: border-box;
      font: inherit;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>My Expense Tracker</h1>
  <p>Keep track of where your money goes.</p>
    <form>
    <label for="amount">Amount</label>
    <input
      type="number"
      id="amount"
      min="0.01"
      step="0.01"
      placeholder="Enter amount"
      required
    >
    <label for="category">Category</label>
    <select id="category" required>
      <option value="">Choose a category</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Shopping">Shopping</option>
      <option value="Bills">Bills</option>
      <option value="Other">Other</option>
    </select>
        <label for="date">Date</label>
    <input type="date" id="date" required>
        <label for="note">Note (optional)</label>
    <input
      type="text"
      id="note"
      placeholder="What did you spend on?"
      maxlength="100"
    >
    <button type="submit">Add expense</button>
  </form>
    <h2>Total spending: <span id="total">0.00</span></h2>
    <h2>Your expenses</h2>
  <p id="empty-message">No expenses added yet.</p>
  <ul id="expense-list"></ul>
    <script>
            function setTodayDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      document.getElementById("date").value = `${year}-${month}-${day}`;
    }

    setTodayDate();
        function deleteExpense(index) {
      expenses.splice(index, 1);
      localStorage.setItem("expenses", JSON.stringify(expenses));
      window.location.reload();
    }
            let total = 0;
                    const expenses = JSON.parse(localStorage.getItem("expenses")) || [];
                        expenses.forEach(function (expense, index) {
      const item = document.createElement("li");

      item.textContent =
        `${expense.date} — ${expense.category} — ${expense.amount.toFixed(2)}` +
        (expense.note ? ` — ${expense.note}` : "");
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.type = "button";
      deleteButton.style.marginLeft = "12px";

      deleteButton.addEventListener("click", function () {
        deleteExpense(index);
      });

      item.appendChild(deleteButton);
      document.getElementById("expense-list").appendChild(item);
      total = total + expense.amount;
    });

    document.getElementById("total").textContent = total.toFixed(2);
    document.getElementById("empty-message").hidden = expenses.length > 0;
    const form = document.querySelector("form");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
            const amount = document.getElementById("amount").value;
      const category = document.getElementById("category").value;
      const date = document.getElementById("date").value;
      const note = document.getElementById("note").value;
      const expense = {
        amount: Number(amount),
        category: category,
        date: date,
        note: note
      };

      expenses.push(expense);
            const expenseIndex = expenses.length - 1;
            localStorage.setItem("expenses", JSON.stringify(expenses));
      const item = document.createElement("li");
      item.textContent =
        `${date} — ${category} — ${Number(amount).toFixed(2)}` +
        (note ? ` — ${note}` : "");
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.type = "button";
      deleteButton.style.marginLeft = "12px";

      deleteButton.addEventListener("click", function () {
        deleteExpense(expenseIndex);
      });

      item.appendChild(deleteButton);
      document.getElementById("expense-list").appendChild(item);
      document.getElementById("empty-message").hidden = true;
      total = total + Number(amount);
      document.getElementById("total").textContent = total.toFixed(2);
      form.reset();
            setTodayDate();
    });
  </script>
</body>
</html>
